# Runs the tests of the app logic. They need AppKit, so they run on a Mac.

name: Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  tests:
    # The code needs Swift 6.2, which comes with Xcode 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: ./test.sh
